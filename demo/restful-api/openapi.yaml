openapi: 3.1.0
info:
  title: Wedding Products API (RESTful demo)
  version: 1.0.0
  description: |
    Demo API minh hoạ quy chuẩn trong `docs/api/restful-api.md`:
    plural-noun URIs, correct status codes, cursor pagination,
    RFC 7807 problem+json errors, ETag/If-Match, Idempotency-Key.
servers:
  - url: http://localhost:3000/v1
tags:
  - name: Products
paths:
  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Liệt kê products (cursor pagination, filter, sort)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ProductStatus" }
        - name: q
          in: query
          description: Tìm theo tên (substring, case-insensitive)
          schema: { type: string, maxLength: 80 }
        - name: sort
          in: query
          schema:
            type: string
            enum: ["created_at", "-created_at", "price", "-price", "name", "-name"]
            default: "-created_at"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Products]
      operationId: createProduct
      summary: Tạo product
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: Retry an toàn — cùng key + cùng payload trả lại response đã lưu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductCreate" }
      responses:
        "201":
          description: Created
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Products]
      operationId: getProduct
      summary: Lấy 1 product (hỗ trợ If-None-Match → 304)
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "304": { description: Not Modified }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [Products]
      operationId: replaceProduct
      summary: Thay toàn bộ product (yêu cầu If-Match)
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductReplace" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [Products]
      operationId: patchProduct
      summary: Cập nhật một phần (JSON Merge Patch, yêu cầu If-Match)
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/ProductPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Xoá product
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/Problem" }
components:
  schemas:
    ProductStatus:
      type: string
      enum: [draft, active, archived]
    ProductCreate:
      type: object
      required: [name, price]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{2,63}$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/ProductStatus" }
        price: { type: integer, minimum: 0 }
        tags:
          type: array
          maxItems: 20
          items: { type: string }
    ProductReplace:
      type: object
      required: [name, status, price]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/ProductStatus" }
        price: { type: integer, minimum: 0 }
        tags:
          type: array
          maxItems: 20
          items: { type: string }
    ProductPatch:
      type: object
      properties:
        name: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ProductStatus" }
        price: { type: [integer, "null"] }
        tags:
          type: [array, "null"]
          items: { type: string }
    Product:
      allOf:
        - $ref: "#/components/schemas/ProductReplace"
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    ProductList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        pagination:
          type: object
          required: [limit, has_more]
          properties:
            limit: { type: integer }
            next_cursor: { type: [string, "null"] }
            has_more: { type: boolean }
    Problem:
      type: object
      description: RFC 7807 Problem Details (application/problem+json)
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
  responses:
    Problem:
      description: Lỗi theo RFC 7807
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
